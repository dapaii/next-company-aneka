<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#193764;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#0f2454;stop-opacity:1"></stop>
    </linearGradient>
    <style>
      .wave {
        fill: none;
        stroke: rgba(255,255,255,0.08);
        stroke-width: 2;
        stroke-dasharray: 2000;
        animation: moveWave 12s linear infinite;
      }
      .wave2 {
        fill: none;
        stroke: rgba(255,255,255,0.05);
        stroke-width: 2;
        stroke-dasharray: 2500;
        animation: moveWave 18s linear infinite;
      }
      .wave3 {
        fill: none;
        stroke: rgba(255,255,255,0.03);
        stroke-width: 2;
        stroke-dasharray: 3000;
        animation: moveWave 25s linear infinite;
      }
      @keyframes moveWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -2000; }
      }
    </style>
  </defs>
  <rect width="1440" height="800" fill="url(#grad)"></rect>
  <path class="wave" d="M0 600 Q360 500 720 600 T1440 600"></path>
  <path class="wave2" d="M0 700 Q360 600 720 700 T1440 700"></path>
  <path class="wave3" d="M0 800 Q360 700 720 800 T1440 800"></path>
</svg>
